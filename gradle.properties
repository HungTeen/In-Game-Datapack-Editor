# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod Properties
mod_id=ide
mod_name=InGame Datapack Editor
mod_display_name=InGame Datapack Editor
mod_version=1.0.0
mod_authors=HungTeen
mod_group_id=hungteen.ide
mod_license=GNU LESSER GENERAL PUBLIC LICENSE
mod_issue_url = https://github.com/HungTeen/In-Game-Datapack-Editor/issues
mod_display_url = https://github.com/HungTeen/In-Game-Datapack-Editor
mod_logo_file = logo.png
mod_description=Edit Minecraft datapacks in-game with forms generated from codecs.

# Compatible Properties
# CurseForge file ID for HTLib-1.20.1-1.2.0.jar.
htlib_version = 6616773
# Optional: -Phtlib_local_dir=/path/to/local/htlib/jars
htlib_local_version = 1.2.0
htlib_version_range = [1.2.0, )
